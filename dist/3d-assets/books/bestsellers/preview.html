<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestsellers · Animated Book</title><link rel="stylesheet" href="../runtime/style.css"><link rel="stylesheet" href="./book.css"></head><body><main id="asset" aria-label="Bestsellers · Animated Book"></main><script type="module">
import {mountBestsellers as mount} from './viewer.js';const p=new URLSearchParams(location.search);
try{const view=await mount(document.querySelector('#asset'),{edition:p.get('edition')||undefined,controls:p.get('controls')!=='false',background:p.get('background')||'dark',open:p.get('open')==='true'});document.body.dataset.state='ready';parent.postMessage({type:'book-asset',kind:'bestsellers',state:'ready'},'*');addEventListener('pagehide',view.dispose,{once:true});}catch(error){document.body.dataset.state='error';parent.postMessage({type:'book-asset',kind:'bestsellers',state:'error'},'*');console.error(error);}
</script></body></html>
